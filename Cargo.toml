[package]
name = "rust-server-demo"
version = "0.1.0"
edition = "2021"
description = "A real-time/long-connection server with PostgreSQL, Redis, and Kafka"
authors = ["Your Name <your.email@example.com>"]

[features]
default = []
kafka = ["dep:rdkafka"]

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = "0.7"

# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "compression-gzip", "catch-panic", "propagate-header", "sensitive-headers"] }
hyper = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }

# Redis
redis = { version = "0.28", features = ["tokio-comp", "connection-manager", "aio"] }

# Kafka (optional)
rdkafka = { version = "0.37", features = ["tokio", "cmake-build"], optional = true }

# Authentication
jsonwebtoken = "9.3"
bcrypt = "0.16"
sha2 = "0.10"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Logging and telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.24"
opentelemetry = "0.23"
opentelemetry-jaeger = "0.22"
metrics = "0.23"
prometheus = "0.13"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Configuration
config = "0.15"
dotenvy = "0.15"

# API Documentation
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid"] }
#utoipa-swagger-ui = { version = "8.1", features = ["axum"] }

# WebSocket
tokio-tungstenite = "0.26"

# Time handling
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Async traits
async-trait = "0.1"

# HTTP client (for external services)
reqwest = { version = "0.12", features = ["json"] }

# Base64 (for JWT etc)
base64 = "0.22"

# Utilities
regex = "1.11"
lazy_static = "1.5"
ammonia = "4.0"

# Futures
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "server"
path = "src/main.rs"
